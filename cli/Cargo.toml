[package]
name = "task-cli"
version = "0.1.5"
edition = "2021"
license = "MIT"
description = "Sync sprint and task Markdown documents in a repository with Fira"

[[bin]]
name = "task-cli"
path = "src/main.rs"

# Standalone on purpose: no dependency on fira-api, so none of the server's
# dependencies (sqlx, axum, aws) end up in the CLI. It talks to Fira over
# HTTP with an automation token like any other client.
[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive"] }
pulldown-cmark = { version = "0.12", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
toml = "0.8"
toml_edit = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
