# Daily database backup trigger.
#
# The fira-backup Fly machine has `--schedule daily`, but Fly never started it
# (no flyd `start` events between 2026-11-12 and 2026-11-19). So this workflow
# starts the machine itself, waits for the job to finish and fails (red ✗,
# email from GitHub) when the backup did not complete.
#
# Needs the repo secret FLY_BACKUP_TOKEN:
#   fly tokens create deploy -a fira-backup
# Run by hand: Actions → db-backup → Run workflow.
name: db-backup

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_BACKUP_TOKEN }}
      APP: fira-backup
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run backup machine
        run: |
          set -euo pipefail
          machines() { flyctl machine list -a "$APP" --json; }

          count="$(machines | jq length)"
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly 1 machine in $APP, found $count"
            exit 1
          fi
          id="$(machines | jq -r '.[0].id')"
          state="$(machines | jq -r '.[0].state')"
          if [ "$state" != stopped ]; then
            echo "::error::machine $id is $state, not stopped; is a backup already running?"
            exit 1
          fi

          # Print what we're about to start, so a wrong machine is obvious.
          machines | jq -r '.[0] | "machine \(.id) name=\(.name) region=\(.region) image=\(.config.image // .image_ref.repository)"'

          # 30s of slack for clock skew between the runner and Fly.
          start_ms="$(( ($(date +%s) - 30) * 1000 ))"
          flyctl machine start "$id" -a "$APP"

          # The job exits on its own; restart policy is `no`, so it ends stopped.
          sleep 15
          for _ in $(seq 1 100); do
            state="$(machines | jq -r '.[0].state')"
            [ "$state" = stopped ] && break
            sleep 15
          done
          if [ "$state" != stopped ]; then
            echo "::error::machine $id still $state after ~25 minutes"
            exit 1
          fi

          # Judge the run by the machine's own exit event (Machines API), not by
          # `flyctl logs`, which lags by minutes and came back empty.
          case "$FLY_API_TOKEN" in FlyV1\ *) auth="$FLY_API_TOKEN" ;; *) auth="Bearer $FLY_API_TOKEN" ;; esac
          machine_json="$(curl -fsS -H "Authorization: $auth" \
            "https://api.machines.dev/v1/apps/$APP/machines/$id")"
          exit_event="$(printf '%s' "$machine_json" | jq -c --argjson s "$start_ms" \
            '[.events[] | select(.type == "exit" and .timestamp >= $s)] | sort_by(.timestamp) | last')"
          echo "exit event: $exit_event"

          # Logs are for humans only; never fail on them.
          echo "--- recent logs ---"
          flyctl logs -a "$APP" -i "$id" --no-tail 2>&1 | tail -40 || true

          if [ "$exit_event" = null ] || [ -z "$exit_event" ]; then
            echo "::error::no exit event for machine $id after start; did it actually run?"
            printf '%s' "$machine_json" | jq '.events[:5]'
            exit 1
          fi
          code="$(printf '%s' "$exit_event" | jq -r '.request.exit_event.exit_code')"
          if [ "$code" != 0 ]; then
            echo "::error::fira-backup exited with code $code (see logs above / fly logs -a $APP)"
            exit 1
          fi
          echo "::notice::fira-backup on machine $id exited 0"
