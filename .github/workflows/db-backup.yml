# Daily database backup trigger.
#
# The fira-backup Fly machine has `--schedule daily`, but Fly never started it
# (no flyd `start` events between 2026-11-12 and 2026-11-19). So this workflow
# starts the machine itself, waits for the job to finish and fails (red ✗,
# email from GitHub) when the backup did not complete.
#
# Needs the repo secret FLY_BACKUP_TOKEN:
#   fly tokens create deploy -a fira-backup
# Run by hand: Actions → db-backup → Run workflow.
name: db-backup

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_BACKUP_TOKEN }}
      APP: fira-backup
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run backup machine
        run: |
          set -euo pipefail
          machines() { flyctl machine list -a "$APP" --json; }

          count="$(machines | jq length)"
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly 1 machine in $APP, found $count"
            exit 1
          fi
          id="$(machines | jq -r '.[0].id')"
          state="$(machines | jq -r '.[0].state')"
          if [ "$state" != stopped ]; then
            echo "::error::machine $id is $state, not stopped; is a backup already running?"
            exit 1
          fi

          # Log lines start with this format, so they compare as strings.
          since="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          flyctl machine start "$id" -a "$APP"

          # The job exits on its own; restart policy is `no`, so it ends stopped.
          sleep 15
          for _ in $(seq 1 100); do
            state="$(machines | jq -r '.[0].state')"
            [ "$state" = stopped ] && break
            sleep 15
          done
          if [ "$state" != stopped ]; then
            echo "::error::machine $id still $state after ~25 minutes"
            exit 1
          fi

          # `machine list --json` has no exit events, so judge the run by the
          # job's own log lines from this run. Logs can lag a little; retry.
          logs=""
          for _ in $(seq 1 12); do
            logs="$(flyctl logs -a "$APP" --no-tail 2>/dev/null | awk -v s="$since" '$1 >= s' || true)"
            if printf '%s\n' "$logs" | grep -qE 'fira-backup: (done|FAILED)'; then break; fi
            sleep 10
          done

          echo "--- logs from this run ---"
          printf '%s\n' "$logs" | grep -E 'fira-backup:|exited|restart policy' || true

          if printf '%s\n' "$logs" | grep -q 'fira-backup: FAILED'; then
            echo "::error::$(printf '%s\n' "$logs" | grep 'fira-backup: FAILED' | tail -1)"
            exit 1
          fi
          if ! printf '%s\n' "$logs" | grep -q 'fira-backup: done: '; then
            echo "::error::no 'fira-backup: done' line in the logs for this run"
            printf '%s\n' "$logs" | tail -40
            exit 1
          fi
          echo "::notice::$(printf '%s\n' "$logs" | grep -o 'fira-backup: done: .*' | tail -1)"
